name: Build Nano Mobi Tool APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Run tests
        run: |
          set -euo pipefail
          uv sync --extra dev
          uv run pytest

      - name: Build APK
        env:
          FLET_CLI_NO_RICH_OUTPUT: "1"
          FLET_CLI_SKIP_FLUTTER_DOCTOR: "1"
          SKIP_FLUTTER_DOCTOR: "1"
        run: |
          set -euo pipefail
          chmod +x build_mobi_tool_apk.sh
          ./build_mobi_tool_apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nano-mobi-tool-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
