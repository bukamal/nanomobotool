[project]
name = "mobi-tool"
version = "0.1.0"
description = "Nano Mobi Tool - Android-native mobile device servicing toolkit"
requires-python = ">=3.10"
dependencies = [
    # Verified against 0.85.2. Flet renamed several control helpers across the
    # 0.8x line (ft.padding.* -> ft.Padding.*, ft.alignment.center ->
    # ft.Alignment.CENTER, ft.border.all -> ft.Border.all). tests/unit and
    # tests/integration catch that drift on upgrade.
    "flet>=0.85.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # tomllib landed in 3.11; the packaging contract tests need a parser on 3.10.
    "tomli>=2.0; python_version < '3.11'",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["build", "dist"]

[tool.ruff.lint]
# Same narrow, bug-focused selection as the sibling nano project.
select = [
    "F",   # pyflakes: unused imports/vars, undefined names
    "E9",  # syntax errors
    "B",   # bugbear: real-world bug patterns
]
ignore = [
    "B008",  # calls in default args are intentional with Flet controls
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/unit", "tests/integration", "tests/contract"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "unit: fast pure-python tests (no device, no UI runtime)",
    "integration: tests that build a real Flet control tree",
    "contract: configuration/layering contracts that guard the Android build",
]

[tool.coverage.run]
source = ["mobi_tool"]
branch = true
omit = ["*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 10

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Flet packaging
# ---------------------------------------------------------------------------
[tool.flet]
org = "com.nano"
product = "Nano Mobi Tool"
company = "Nano"
copyright = "Copyright (C) 2026"

[tool.flet.app]
path = "src"
module = "main"

[tool.flet.splash]
color = "#0B1120"
dark_color = "#070C17"
android = true

[tool.flet.android]
adaptive_icon_background = "#0B1120"
# pyjnius is the JNI bridge that lets Python call android.hardware.usb.*.
# Android-only: it is deliberately NOT in [project.dependencies], so desktop
# runs stay installable without a JVM.
# Guarded by tests/contract/test_packaging_contract.py.
dependencies = [
    "pyjnius",
]

# USB host is a hard requirement for this app - without it there is nothing to
# talk to. Declaring it as a required feature also keeps the app out of
# Play Store search results on devices that cannot host USB at all.
# (Verified: this section name is real and is used by the sibling nano project.)
[tool.flet.android.feature]
"android.hardware.usb.host" = true

[tool.flet.android.manifest_application]
# Repair tool: never let the OS back up or restore app state across devices.
allowBackup = "false"
